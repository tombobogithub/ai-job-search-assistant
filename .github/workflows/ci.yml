name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jobuser
          POSTGRES_PASSWORD: jobpassword
          POSTGRES_DB: job_search_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jobuser -d job_search_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://jobuser:jobpassword@localhost:5432/job_search_test
      TEST_DATABASE_URL: postgresql+psycopg://jobuser:jobpassword@localhost:5432/job_search_test
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
        